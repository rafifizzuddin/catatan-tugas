<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Notes</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--txt:#172033;--muted:#718096;--line:#dfe6ef;--blue:#315efb;--red:#ef4444;--orange:#f59e0b;--green:#22c55e;--purple:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#0b1220;color:white;padding:20px}.brand{font-size:20px;font-weight:800;margin:5px 8px 25px}.nav button{display:block;width:100%;text-align:left;background:0;border:0;color:#b9c4d5;padding:12px;border-radius:9px;cursor:pointer}.nav button:hover,.nav .on{background:#1b2942;color:white}main{padding:26px;max-width:1450px;width:100%;margin:auto}h1{margin:0 0 4px;font-size:28px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:15px;margin-bottom:20px}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:white;cursor:pointer;font-weight:650}.primary{background:var(--blue);color:white;border-color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 25px #1e35500d}.stat{padding:16px}.stat b{font-size:26px;display:block}.grid{display:grid;grid-template-columns:1fr 340px;gap:16px}.head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.list{padding:9px}.task{background:white;border:1px solid var(--line);border-left:6px solid var(--green);border-radius:11px;padding:12px;margin:8px}.task.medium{border-left-color:var(--orange)}.task.high{border-left-color:var(--red)}.task.urgent{border-left-color:var(--purple)}.task.done{opacity:.5}.task.done .title{text-decoration:line-through}.row{display:flex;gap:10px;align-items:flex-start}.check{margin-top:3px;width:19px;height:19px}.title{font-weight:750}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tag{font-size:11px;background:#eef2f7;padding:4px 7px;border-radius:99px}.today{background:#fee2e2;color:#991b1b}.tomorrow{background:#ffedd5;color:#9a3412}.soon{background:#fef9c3;color:#854d0e}.safe{background:#dcfce7;color:#166534}.actions{margin-left:auto;white-space:nowrap}.icon{border:0;background:0;cursor:pointer}.controls{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}.controls input,.controls select,.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:9px;background:white}.controls input{flex:1;min-width:180px}.tom{padding:12px;margin:7px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:12px}.day{min-height:95px;border:1px solid var(--line);border-radius:9px;padding:8px}.day.now{border:2px solid var(--blue);background:#f4f7ff}.dot{display:block;background:#eaf0ff;border-radius:5px;padding:3px;margin-top:4px;font-size:10px;overflow:hidden;white-space:nowrap}.empty{text-align:center;padding:30px;color:var(--muted)}.modalbg{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal{background:white;width:min(580px,100%);border-radius:15px}.form{padding:18px;display:grid;gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:90px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:white;padding:12px 15px;border-radius:9px;display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{padding:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:15px}.top{flex-direction:column}.week{overflow:auto;grid-template-columns:repeat(7,100px)}.two{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">✓ Smart Notes</div><div class="nav"><button class="on" onclick="page('home',this)">🏠 Dashboard</button><button onclick="page('all',this)">📝 Semua Catatan</button><button onclick="page('week',this)">📅 Mingguan</button></div></aside>
<main><div class="top"><div><h1 id="greet"></h1><div class="muted" id="date"></div></div><div><button class="btn" onclick="resetData()">↻ Reset</button> <button class="btn primary" onclick="openForm()">＋ Catatan</button></div></div>
<section id="home"><div class="stats"><div class="stat">Total<b id="total">0</b></div><div class="stat">Belum selesai<b id="open">0</b></div><div class="stat">Hari ini<b id="today">0</b></div><div class="stat">Besok<b id="tomorrow">0</b></div></div><div class="grid"><div class="panel"><div class="head"><b>🔥 Yang perlu diperhatikan</b><span class="muted" id="percent"></span></div><div class="list" id="important"></div></div><div class="panel"><div class="head"><b>🌅 Besok harus siap</b></div><div class="list" id="next"></div></div></div></section>
<section id="all" style="display:none"><div class="panel"><div class="head"><b>📝 Semua Catatan</b></div><div class="controls"><input id="search" placeholder="Cari tugas..." oninput="render()"><select id="course" onchange="render()"><option value="">Semua mata kuliah</option></select><select id="priority" onchange="render()"><option value="">Semua prioritas</option><option value="urgent">Urgent</option><option value="high">Tinggi</option><option value="medium">Sedang</option><option value="low">Rendah</option></select></div><div class="list" id="allList"></div></div></section>
<section id="week" style="display:none"><div class="panel"><div class="head"><b>📅 Minggu berjalan</b><span class="muted">Hari ini diberi garis biru</span></div><div class="week" id="weekGrid"></div></div></section>
</main></div>
<div class="modalbg" id="modal"><div class="modal"><div class="head"><b id="mtitle">Tambah Catatan</b><button class="icon" onclick="closeForm()">✕</button></div><form class="form" onsubmit="saveForm(event)"><input type="hidden" id="id"><div class="field"><label>Tugas / catatan</label><input id="title" required></div><div class="two"><div class="field"><label>Kelompok</label><select id="group"><option>MKR</option><option>MKU</option><option>Lainnya</option></select></div><div class="field"><label>Mata kuliah</label><input id="subject" required></div></div><div class="two"><div class="field"><label>Deadline</label><input id="due" type="date"></div><div class="field"><label>Prioritas</label><select id="prio"><option value="low">Rendah</option><option value="medium" selected>Sedang</option><option value="high">Tinggi</option><option value="urgent">Urgent</option></select></div></div><div class="field"><label>Yang perlu disiapkan / catatan tambahan</label><textarea id="note"></textarea></div><div class="foot"><button type="button" class="btn" onclick="closeForm()">Batal</button><button class="btn primary">Simpan</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const KEY='smart-notes-v2';
const seed=[
['MKR','Sistem Informasi','Presentasi',2,'high'],['MKR','Matematika Komputasi','PR Ilmu',3,'medium'],['MKR','Arsitektur Komputer','Nonton video',4,'low'],['MKR','Etika & Kompetensi Informatika','Bikin infografis',5,'high'],['MKU','Bahasa Indonesia','Belum ada tugas',2,'low'],['MKU','Bahasa Inggris','Tugas video percakapan',3,'high'],['MKU','Pancasila','Bikin PPT',4,'high']
].map((x,i)=>({id:'seed'+i,group:x[0],subject:x[1],title:x[2],day:x[3],priority:x[4],done:false,due:null,note:''}));
let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function now(){let d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function iso(d){return d.toISOString().slice(0,10)}
function diff(t){if(t.due)return Math.round((new Date(t.due+'T00:00:00')-now())/864e5);let d=now(),target=t.day,cur=d.getDay()||7,n=(target-cur+7)%7;return n}
function due(t){let n=diff(t);if(n<0)return['Lewat '+(-n)+' hari','today',-9];if(n==0)return['HARI INI','today',0];if(n==1)return['BESOK','tomorrow',1];if(n<=3)return[n+' hari lagi','soon',n];return[n+' hari lagi','safe',n]}
function pri(p){return{urgent:'URGENT',high:'TINGGI',medium:'SEDANG',low:'RENDAH'}[p]}
function card(t){let d=due(t);return `<div class="task ${t.priority} ${t.done?'done':''}"><div class="row"><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}')"><div style="flex:1"><div class="title">${esc(t.title)}</div><div class="meta"><span class="tag">${esc(t.group)}</span><span class="tag">${esc(t.subject)}</span><span class="tag">${pri(t.priority)}</span><span class="tag ${d[1]}">${d[0]}</span>${t.note?`<span class="tag">💡 ${esc(t.note)}</span>`:''}</div></div><div class="actions"><button class="icon" onclick="edit('${t.id}')">✏️</button><button class="icon" onclick="del('${t.id}')">🗑️</button></div></div></div>`}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
 let open=data.filter(x=>!x.done), td=open.filter(x=>due(x)[2]===0), tm=open.filter(x=>due(x)[2]===1), done=data.filter(x=>x.done).length;
 $('total').textContent=data.length;$('open').textContent=open.length;$('today').textContent=td.length;$('tomorrow').textContent=tm.length;$('percent').textContent=(data.length?Math.round(done/data.length*100):0)+'% selesai';
 let sorted=open.sort((a,b)=>due(a)[2]-due(b)[2]||({urgent:0,high:1,medium:2,low:3}[a.priority]-{urgent:0,high:1,medium:2,low:3}[b.priority]));
 $('important').innerHTML=sorted.length?sorted.slice(0,8).map(card).join(''):'<div class="empty">🎉 Semua tugas selesai!</div>';
 $('next').innerHTML=tm.length?tm.map(x=>`<div class="tom"><b>${esc(x.subject)}</b><br>${esc(x.title)}<br><small class="muted">Prioritas ${pri(x.priority)}${x.note?' · '+esc(x.note):''}</small></div>`).join(''):'<div class="empty">Besok tidak ada tugas 🎉</div>';
 let q=($('search')?.value||'').toLowerCase(),c=$('course')?.value||'',p=$('priority')?.value||'';
 let arr=data.filter(x=>(!q||`${x.title} ${x.subject} ${x.group} ${x.note}`.toLowerCase().includes(q))&&(!c||x.subject===c)&&(!p||x.priority===p)).sort((a,b)=>due(a)[2]-due(b)[2]);
 $('allList').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">Tidak ada catatan.</div>';
 let cur=$('course').value, courses=[...new Set(data.map(x=>x.subject))].sort();$('course').innerHTML='<option value="">Semua mata kuliah</option>'+courses.map(x=>`<option>${esc(x)}</option>`).join('');$('course').value=courses.includes(cur)?cur:'';
 week();save();
}
function week(){let d=now(),j=d.getDay()||7,m=new Date(d);m.setDate(d.getDate()-j+1);let names=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];$('weekGrid').innerHTML=names.map((n,i)=>{let x=new Date(m);x.setDate(m.getDate()+i);let day=i+1,items=data.filter(t=>t.day===day||t.due===iso(x));return `<div class="day ${iso(x)===iso(d)?'now':''}"><b>${n}</b><div>${x.getDate()}</div>${items.map(t=>`<span class="dot">${esc(t.title)}</span>`).join('')}</div>`}).join('')}
function toggle(id){let t=data.find(x=>x.id===id);t.done=!t.done;save();render();toast(t.done?'Selesai ✓':'Dikembalikan')}
function del(id){if(confirm('Hapus catatan ini?')){data=data.filter(x=>x.id!==id);save();render();toast('Dihapus')}}
function openForm(t){$('modal').style.display='flex';$('id').value=t?.id||'';$('title').value=t?.title||'';$('group').value=t?.group||'MKR';$('subject').value=t?.subject||'';$('due').value=t?.due||'';$('prio').value=t?.priority||'medium';$('note').value=t?.note||'';$('mtitle').textContent=t?'Edit Catatan':'Tambah Catatan'}
function closeForm(){$('modal').style.display='none'}
function edit(id){openForm(data.find(x=>x.id===id))}
function saveForm(e){e.preventDefault();let id=$('id').value,obj={title:$('title').value.trim(),group:$('group').value,subject:$('subject').value.trim(),due:$('due').value||null,priority:$('prio').value,note:$('note').value.trim()};if(id)Object.assign(data.find(x=>x.id===id),obj);else data.push({...obj,id:'x'+Date.now(),done:false,day:obj.due?(new Date(obj.due+'T00:00:00').getDay()||7):1});closeForm();render();toast('Tersimpan ✓')}
function page(id,btn){['home','all','week'].forEach(x=>$(x).style.display=x===id?'block':'none');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));btn.classList.add('on')}
function resetData(){if(confirm('Reset ke catatan awal?')){data=seed.map(x=>({...x}));render();toast('Data awal dipulihkan')}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
let h=new Date().getHours();$('greet').textContent=(h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam')+' 👋';$('date').textContent=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());render();
</script></body></html>
